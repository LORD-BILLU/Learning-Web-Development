<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <script defer src="script.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="container flex bg-black">

        <!-- Left Section -->
        <div class="left">
            <!-- HOME SECTION -->
            <div class="home bg-grey rounded p-1 m-1">
                <div class="logo"><img class="invert" src="logo.svg" alt="logo">Spotify</div>
                <ul>
                    <li><img class="invert" src="home.svg" alt="home">Home</li>
                    <li><img class="invert" src="search .svg" alt="search">Search</li>
                </ul>
            </div>
            <!-- Library Section -->
            <div class="library bg-grey rounded p-1 m-1">
                Your Library
            </div>
        </div>

        <!-- Right Section -->
        <div class="right rounded bg-grey">
            <div class="header flex rounded">

                <div class="nav">
                    <!-- LEft arrow -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                        color="currentColor" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18" />
                    </svg>
                    <!-- right arrow -->
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                        color="currentColor" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18" />
                    </svg>
                </div>

                <div class="buttons">
                    <button class="signUp">Sign up</button>
                    <button class="logIn">Log in</button>
                </div>
            </div>

            <div class="spotifyPlaylists">
                <h1>Spotify Playlists</h1>
                <div class="cardContainer">


                    <div class="card">
                        <div class="play">
                            <svg xmlns="http://www.w3.org/2000/svg" width="35" height="35" viewBox="0 0 512 512">
                                <circle cx="256" cy="256" r="256" fill="#1ED760" />

                                <path d="
                                            M185 145
                                            Q185 120 208 134
                                            L390 242
                                            Q418 256 390 270
                                            L208 378
                                            Q185 392 185 367
                                            Z
                                        " fill="#000000" />
                            </svg>
                        </div>
                        <img src="music-cover.jpg" alt="card">
                        <h4>Happy Hits</h4>
                        <p>Hits to Boost your Mood</p>
                    </div>


                </div>

                <div class="playBar">
                    <div class="songInfo"></div>
                    <div class="songButtons">
                        <img src="prev.svg" alt="prev_btn">
                        <img src="play.svg" alt="play_btn">
                        <img src="next.svg" alt="next_btn">
                    </div>
                    <div class="songTime"></div>
                </div> 
            </div>
        </div>
    </div>

</body>

</html>
